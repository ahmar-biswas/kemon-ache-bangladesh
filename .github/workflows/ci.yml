# Runs on every push and pull request. Any failing step blocks the change.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Translation check (every key has Bangla)
        run: npm run check:i18n
      - name: Data check (every record has a source, values pass validation)
        run: npm run check:data
      - name: Unit tests and source check (every shown value has a source line)
        run: npm test
      - name: Build (with pre-rendered pages)
        run: npm run build
      - name: Site crawl (every page in both languages; uses the runner's Chrome)
        run: npm run check:crawl

  # Only a push to main that passed every check above is published (M9).
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
