    <script>
      // Data saver and very low-end phones get plain paper: no contours, grain or blur (8.4, R10).
      (function () {
        var c = navigator.connection, el = document.documentElement;
        if (c && c.saveData) el.classList.add('save-data');
        if ((navigator.deviceMemory && navigator.deviceMemory <= 1) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2)) el.classList.add('lite');
      })();
    </script>
